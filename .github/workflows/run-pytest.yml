name: Run Unit Tests

on:
  # trigger on pull requests
  pull_request:

  # trigger on all commits to main
  push:
    branches:
      - 'main'

  # trigger on request
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          # Other tests
          - os: 'macos-latest'
            python: '3.10'
          - os: 'macos-latest'
            python: '3.13'
    steps:
    - name: Set up and build
      uses: ./.github/workflows/setup-and-build.yaml
      with:
        python: ${{ matrix.python }}
        os: ${{ matrix.os }}

    - name: Test with pytest
      run: |
        python -m pytest
